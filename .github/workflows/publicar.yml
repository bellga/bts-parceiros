name: Publicar pacotes

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publicar:
    # Windows: o Bts.Login.Maui precisa sair com as plataformas Android e Windows
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write # Trusted Publishing: o GitHub prova ao nuget.org que a publicação vem deste workflow
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - name: Workload do MAUI
        run: dotnet workload install maui
      - name: Testes
        run: dotnet test tests/Bts.Login.AspNetCore.Testes -c Release; dotnet test tests/Bts.Login.Cliente.Testes -c Release
      - name: Empacotar
        shell: bash
        run: |
          VERSAO="${GITHUB_REF_NAME#v}"
          grep -q "<Version>$VERSAO</Version>" Directory.Build.props \
            || { echo "A tag v$VERSAO não bate com a <Version> do Directory.Build.props"; exit 1; }
          for p in Bts.Login.AspNetCore Bts.Login.Cliente Bts.Login.Maui; do
            dotnet pack "src/$p/$p.csproj" -c Release -o pacotes
          done
          ls -l pacotes
      # Chave temporária (1 hora, uso único), pedida logo antes de enviar
      - name: Entrar no nuget.org (Trusted Publishing)
        uses: NuGet/login@v1
        id: nuget
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Publicar no nuget.org
        shell: bash
        run: |
          # Um arquivo por vez (o curinga do "nuget push" não funciona no Windows); o .snupkg vai junto
          shopt -s nullglob
          arquivos=(pacotes/*.nupkg)
          [ ${#arquivos[@]} -eq 3 ] || { echo "Esperava 3 pacotes, achei ${#arquivos[@]}"; exit 1; }
          for f in "${arquivos[@]}"; do
            dotnet nuget push "$f" --source https://api.nuget.org/v3/index.json \
              --api-key "${{ steps.nuget.outputs.NUGET_API_KEY }}" --skip-duplicate
          done
