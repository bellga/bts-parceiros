name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: read   # gitleaks lê os commits do PR

jobs:
  segredos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-e-testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - name: Workload do MAUI (Android)
        run: dotnet workload install maui-android
      - name: Restaurar (versões travadas; aviso de vulnerabilidade quebra pelo TreatWarningsAsErrors)
        run: dotnet restore bts-parceiros.slnx --locked-mode
      - name: Build
        run: dotnet build bts-parceiros.slnx -c Release --no-restore
      - name: Testes
        run: dotnet test bts-parceiros.slnx -c Release --no-build

  maui-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - name: Workload do MAUI
        run: dotnet workload install maui
      - name: Build (Windows)
        run: dotnet build src/Bts.Login.Maui/Bts.Login.Maui.csproj -c Release -f net10.0-windows10.0.19041.0
